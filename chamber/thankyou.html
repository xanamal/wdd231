<main>
    <h1>Thank You!</h1>
    <section class="thank-you-card">
        <h2>Your Application Information</h2>

        <p><strong>First Name:</strong> <span id="fname"></span></p>
        <p><strong>Last Name:</strong> <span id="lname"></span></p>
        <p><strong>Email:</strong> <span id="email"></span></p>
        <p><strong>Phone:</strong> <span id="phone"></span></p>
        <p><strong>Organization:</strong> <span id="orgname"></span></p>
        <p><strong>Date:</strong> <span id="timestamp"></span></p>
    </section>
</main>

<script>
    const params = new URLSearchParams(window.location.search);

    document.querySelector("#fname").textContent = params.get("fname") || "";
    document.querySelector("#lname").textContent = params.get("lname") || "";
    document.querySelector("#email").textContent = params.get("email") || "";
    document.querySelector("#phone").textContent = params.get("phone") || "";
    document.querySelector("#orgname").textContent = params.get("orgname") || "";
    document.querySelector("#timestamp").textContent = params.get("timestamp") || "";
</script>
