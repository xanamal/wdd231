<body>
    
    <header>

        <div class="site-branding">
            <div class="logo">X</div>

        </div>


        <nav id="navigation">
            <button id="menu" aria-label="Open navigation"></button>

                <li><a href="index.html">Home</a></li>
                <li><a href="directory.html">Chamber Project</a></li>
                <li><a href="#">Final Project</a></li>
                <li><a href="join.html">Join</a></li>
            </ul>
        </nav>
    </header>



    <main>
        <h1>Join the Chamber</h1>

    <form method="get" action="thankyou.html">

        <label for="fname">First Name</label>
        <input
            type="text"
            id="fname"
            name="fname"
            title="Enter your first name using at least two letters, spaces, or hyphens."
            autocomplete="given-name"
            required
        >

        <label for="lname">Last Name</label>
        <input
            type="text"
            id="lname"
            name="lname"
            title="Enter your last name using at least two letters, spaces, or hyphens."
            autocomplete="family-name"
            required
        >

        <label for="orgtitle">Organization Title</label>
        <input
            type="text"
            id="orgtitle"
            name="orgtitle"
            autocomplete="organization-title"
            title="Enter your organization title using at least seven letters, spaces, or hyphens."
            pattern="[A-Za-z\s\-]{7,}"
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            title="Enter a valid email address."
            placeholder="example@email.com"
            required
        >

        <label for="phone">Mobile Phone</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            autocomplete="tel"
            title="Enter a valid mobile phone number."
            required
        >

        <label for="orgname">Organization Name</label>
        <input
            type="text"
            id="orgname"
            name="orgname"
            title="Enter your organization name using at least two letters, spaces, or hyphens."
            autocomplete="organization"
            required
        >

        <label for="membership">Membership Level</label>
        <select id="membership" name="membership" required>
            <option value="">Select a Membership Level</option>
            <option value="np">NP Membership</option>
            <option value="bronze">Bronze Membership</option>
            <option value="silver">Silver Membership</option>
            <option value="gold">Gold Membership</option>
        </select>

        <label for="description">Organization Description</label>
        <textarea
            id="description"
            name="description"
            rows="5"
            title="Describe your organization."
        ></textarea>

        <input
            type="hidden"
            id="timestamp"
            name="timestamp"
            value=""
        >

        <button type="submit">Submit Application</button>

    </form>

    </main>
