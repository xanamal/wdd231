    <main>
        <main class="contact-main">
  <section class="contact-hero">
    <h1>Contact Us</h1>
    <p>
      Have an idea, found an error, or want to suggest a feature?
      Let us know how we can improve Siege Study.
    </p>
  </section>

  <section class="contact-card">
    <form method="get" action="thankyou.html" class="contact-form">
      <div class="form-row">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" required>
      </div>

      <div class="form-row">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" required>
      </div>

      <div class="form-row full-width">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-row full-width">
        <label for="improve">How can we improve the site?</label>
        <textarea id="improve" name="improve" rows="6" required></textarea>
      </div>

      <fieldset class="rating-box full-width">
        <legend>How was your experience?</legend>

        <div class="stars">
          <input type="radio" id="star5" name="rating" value="5" required>
          <label for="star5">★</label>

          <input type="radio" id="star4" name="rating" value="4">
          <label for="star4">★</label>

          <input type="radio" id="star3" name="rating" value="3">
          <label for="star3">★</label>

          <input type="radio" id="star2" name="rating" value="2">
          <label for="star2">★</label>

          <input type="radio" id="star1" name="rating" value="1">
          <label for="star1">★</label>
        </div>
      </fieldset>

      <button type="submit" class="submit-button">Submit Feedback</button>
    </form>
  </section>
</main>
